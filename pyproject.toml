[project]
name = "discord-architect"
version = "3.1.0"
description = "Discord-Bot, der komplette Server-Strukturen aus Vorlagen baut"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vexo × Fufi" }]
dependencies = [
    "discord.py>=2.6,<3.0",
    "aiohttp>=3.9,<4.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "ISC", "FURB"]
ignore = [
    # Zeilenlaenge wird vom Formatter verwaltet; lange Erklaertexte in
    # Kommentaren und Docstrings sind hier bewusst erlaubt.
    "E501",
    # Die Small-Caps-Typografie (ᴀ, ꜱ) und der Trenner ・ sind der Kern des
    # Projekts. "Mehrdeutige" Unicode-Zeichen sind hier Absicht, kein Fehler.
    "RUF001",
    "RUF002",
    "RUF003",
    # ``class ChannelKind(str, Enum)`` bleibt: die Templates vergleichen die
    # Werte direkt mit JSON-Strings. StrEnum waere aequivalent, aber der
    # Wechsel ist ein Verhaltensrisiko ohne Gegenwert.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Die Tests schieben das Projektwurzelverzeichnis vor dem Import in sys.path,
# deshalb stehen dort Importe zwangslaeufig nicht ganz oben.
"tests/*" = ["E402"]
"tools/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["core", "ui", "config", "web", "bot"]

# --------------------------------------------------------------------------- #
# Mypy
# --------------------------------------------------------------------------- #

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# core/ ist die Domaenenschicht und wird streng geprueft. Die UI-Schicht folgt,
# sobald die generischen discord.ui-Container durchgehend annotiert sind.
[[tool.mypy.overrides]]
module = ["ui.*"]
disable_error_code = ["var-annotated"]

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-q"
# Warnungen sind Fehler in spe. Die Deprecation-Hinweise von pytest haben
# hier schon zweimal auf echte Nachlaessigkeiten gezeigt.
filterwarnings = [
    "error::pytest.PytestRemovedIn10Warning",
]

[tool.coverage.run]
source = ["core", "ui", "web", "bot", "config"]

[tool.coverage.report]
# Die verbleibenden Luecken sind defensive continue/return-Zweige und
# Fallbacks, die sich nur mit unrealistischen Attrappen erreichen lassen.
# Die Schwelle haelt den erreichten Stand, statt zu 100 % zu zwingen.
fail_under = 95
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
